# Project identification
sonar.projectKey=gra-migration-system
sonar.projectName=GRA - Go Rapid API with Migration System
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/node_modules/**,**/docs/**,**/debug/**,**/bin/**,**/cache/**,**/migrations/*.sql,**/*.md,**/*.json,**/*.yml,**/*.yaml,**/*.html,**/*.css,**/*.js,**/*.sh,**/examples/**,**/tools/**,**/cmd/**,gra.go,orm/migrations/demo.go,examples/**,tools/**

# Test files
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**,**/node_modules/**

# Go specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=**/vendor/**,**/node_modules/**,**/docs/**,**/debug/**,**/bin/**,**/cache/**,**/migrations/*.sql,**/*.md,**/*.json,**/*.yml,**/*.yaml,**/*.html,**/*.css,**/*.js,**/*.sh,**/examples/**,**/tools/**,**/cmd/**,gra.go,orm/migrations/demo.go,orm/dbcontext/**,orm/migrations/**

# Exclude non-source files from Text & Secrets analysis to avoid false positives
sonar.text.exclusions=**/*.sh,**/scripts/**,**/docker/**,**/*.env,**/*.sql,**/*.md,**/docs/**

# Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server (adjust as needed)
sonar.host.url=http://localhost:9000

# Additional settings
sonar.qualitygate.wait=true
sonar.analysis.mode=publish

# Ignore high complexity and duplicate literal rules in internal low-risk packages
sonar.issue.ignore.multicriteria=e1,e2,e3
# Ignore Cognitive Complexity in dbcontext and migrations (rule go:S3776)
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=orm/dbcontext/**

sonar.issue.ignore.multicriteria.e2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=orm/migrations/**

# Ignore duplicated literal warning specific to ef_context string (rule go:S1192)
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=orm/dbcontext/ef_context.go
