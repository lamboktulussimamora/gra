version: "2"

# golangci-lint configuration for GRA project

run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true

linters:
  default: none
  enable:
    # Error detection
    - errcheck
    - gosec
    - govet
    - staticcheck

    # Code quality
    - gocyclo
    - ineffassign
    - unconvert
    - unused

    # Style and formatting
    - misspell
    - whitespace

    # Performance
    - bodyclose
    - prealloc

    # Additional useful linters
    - dupl
    - goconst
    - gocritic
    - revive

  settings:
    gocyclo:
      min-complexity: 30
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - goconst
      - path: examples/
        linters:
          - unused
      - path: debug/
        linters:
          - unused
    paths:
      - vendor/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
