version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gra-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=MyPassword_123
      - POSTGRES_DB=gra
    volumes:
      - gra_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gra_pgdata:
